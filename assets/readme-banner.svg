<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" fill="none" role="img" aria-labelledby="banner-title banner-description">
  <title id="banner-title">Resumaire — your job search workspace</title>
  <desc id="banner-description">The folded R logo beside the Resumaire wordmark. Track applications. Tailor resumes. Stay honest. A resume illustration connects real experience to the next role.</desc>
  <defs>
    <!-- Matches frontend/public/brand/resumaire-mark.svg. -->
    <symbol id="brand-mark" viewBox="0 0 64 64">
      <path fill-rule="evenodd" d="M8 8h26v14h14v3c0 8.2-4.4 12.8-12.4 14.9L54 56H40L25.6 41H22v9h6v6H8v-6h5V14H8V8Zm14 10v14h9c5.8 0 9-2.3 9-7v-1h-8v-6H22Z" />
      <path d="m37 8 14 11H37V8Z" />
    </symbol>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#D9D1C4" />
    </pattern>
  </defs>

  <rect width="1280" height="420" rx="8" fill="#F6F3EB" />
  <path d="M8 0h1264a8 8 0 0 1 8 8v4H0V8a8 8 0 0 1 8-8Z" fill="#B64F2C" />
  <rect x="768" y="12" width="512" height="400" fill="url(#grid)" />
  <path d="M744 48v324" stroke="#DDD6C9" />

  <g font-family="Consolas, 'Liberation Mono', monospace" font-size="13" letter-spacing="2" fill="#74685B">
    <text x="68" y="65">YOUR JOB SEARCH WORKSPACE</text>
  </g>
  <use href="#brand-mark" x="58" y="93" width="82" height="82" fill="#B64F2C" />
  <text x="154" y="157" font-family="Georgia, 'Times New Roman', serif" font-size="76" letter-spacing="-3" fill="#302920">Resumaire</text>

  <g font-family="Georgia, 'Times New Roman', serif" font-size="31" fill="#40372D">
    <text x="68" y="234">Track applications. Tailor resumes.</text>
    <text x="68" y="278" fill="#B64F2C">Stay honest.</text>
  </g>
  <path d="M68 329h608" stroke="#DDD6C9" />
  <g font-family="Consolas, 'Liberation Mono', monospace" font-size="13" fill="#74685B">
    <text x="68" y="362">01 / BUILD</text>
    <text x="274" y="362">02 / TRACK</text>
    <text x="480" y="362">03 / TAILOR</text>
  </g>

