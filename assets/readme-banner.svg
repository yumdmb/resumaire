  <text x="1098" y="225" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#52714A">Grounded in you</text>

  <text x="824" y="383" font-family="Consolas, 'Liberation Mono', monospace" font-size="11" letter-spacing="1.2" fill="#74685B">REAL EXPERIENCE. NEW POSSIBILITIES.</text>
